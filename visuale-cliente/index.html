<title>Il mio percorso</title>
<style>
:root{--ink:#14213d;--pine:#1C2B24;--moss:#2F6B4F;--mossD:#24573F;--soft:#eef6f0;--muted:#5f6b66;--line:#d8ddd9;--bg:#f2f4f1;--paper:#fff;--owed:#B45309;--owedSoft:#fdf3e6;--gold:#C9971C;--goldSoft:#fbf3dc;--err:#B42318}
@media (prefers-color-scheme: dark){:root{--ink:#e6ece8;--pine:#e6ece8;--moss:#6FBF93;--mossD:#2F6B4F;--soft:#1f3328;--muted:#a3b0a9;--line:#33423a;--bg:#121815;--paper:#1b231f;--owed:#F0A35E;--owedSoft:#3a2a19;--gold:#E0B24A;--goldSoft:#33291a;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--pine);font:17px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:0 0 40px}
.hero{background:linear-gradient(135deg,#2F6B4F,#24573F);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 22px;border-radius:0 0 22px 22px}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero small{letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85;font-size:.75rem}
.hero h1{font:700 2.4rem/1.05 "Barlow Condensed",Arial,sans-serif;margin:8px 0 4px}
.hero p{margin:0;opacity:.92}
.hero .tools{display:flex;gap:8px}
.ib{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;min-width:38px;height:38px;font:inherit;font-weight:700;cursor:pointer;padding:0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;margin-top:10px}
.upd{font-size:.8rem;opacity:.85;margin-top:8px}
.wrap{padding:0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font:700 1.05rem/1.2 "Barlow Condensed",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--moss);margin:0 0 10px}
.news{background:var(--goldSoft);border-color:#ecd9a3}
.news ul{margin:0;padding-left:18px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .q{font-size:1.6rem;line-height:1}
.msg p{margin:0;font-weight:600}
.msg small{color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 .95rem "Barlow Condensed",Arial,sans-serif;border:2px solid var(--line);color:var(--muted)}
.dot.done{background:var(--moss);border-color:var(--moss);color:#fff}
.dot.miss{background:var(--owedSoft);border-color:var(--owed);color:var(--owed)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tile{background:#f1f3f2;border-radius:14px;padding:10px 4px;text-align:center}
@media (prefers-color-scheme: dark){.tile{background:#232d28}}
.tile b{display:block;font:700 1.8rem/1 "Barlow Condensed",Arial,sans-serif}
.tile span{font-size:.75rem;color:var(--muted);font-weight:600}
.tile.ok{background:var(--soft)} .tile.ok b{color:var(--moss)}
.tile.ms{background:var(--owedSoft)} .tile.ms b{color:var(--owed)}
.due{display:flex;gap:12px;align-items:center;background:var(--owedSoft);border:1px solid #f0d2b0;color:var(--owed);font-weight:700}
.due .i{font-size:1.5rem}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cal-h b{text-transform:capitalize}
.cal-h button{border:1px solid var(--line);background:transparent;color:var(--pine);border-radius:10px;width:36px;height:32px;font-size:1.1rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.85rem}
.cal .wd{color:var(--muted);font-weight:700;font-size:.72rem}
.cal .d{padding:7px 0;border-radius:10px}
.cal .d.s{background:var(--moss);color:#fff;font-weight:700}
.cal .d.m{background:var(--owedSoft);color:var(--owed);font-weight:700}
.cal .d.t{outline:2px solid var(--gold)}
.msum{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.rows .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:0}
.rows .r small{color:var(--muted)}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.ok{background:var(--soft);color:var(--moss)} .tag.todo{background:var(--owedSoft);color:var(--owed)}
.pay3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.badges{list-style:none;padding:0;margin:0}
.badges li{padding:7px 0;font-weight:600}
.badges li.next{color:var(--muted);font-weight:500}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:11px 16px;min-height:44px;cursor:pointer;border:1.5px solid var(--moss);background:transparent;color:var(--moss)}
.btn.primary{background:var(--moss);color:#fff}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.85rem}
.eye{border:1px solid var(--line);background:transparent;color:var(--pine);border-radius:999px;min-width:38px;height:32px}
.sigbox{position:relative;margin:6px 0 4px;border:1px dashed var(--line);border-radius:12px;background:#fff;height:90px}
.sigbox canvas{width:100%;height:100%}
.sigbox .wm{position:absolute;inset:0;display:grid;place-items:center;color:rgba(47,107,79,.22);font:700 1.4rem "Barlow Condensed",Arial;transform:rotate(-12deg);pointer-events:none;letter-spacing:.2em}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 6px}
.foot .btn{border-color:var(--line);color:var(--muted)}
.center{text-align:center}
.gate{padding:30px 18px}
.gate .card{padding:22px 18px}
.gate h1{font:700 1.9rem/1.1 "Barlow Condensed",Arial,sans-serif;margin:6px 0 10px}
.inf{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
label.ck{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-weight:600}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--pine)}
.pin{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pin span{width:52px;height:60px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;font:700 1.8rem "Barlow Condensed",Arial}
.pin span.f{border-color:var(--moss)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keys button{height:58px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--pine);font:600 1.5rem Barlow,Arial}
.big-ic{font-size:3rem;line-height:1}
.veil{position:fixed;inset:0;background:rgba(18,24,21,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;color:#fff;z-index:30;text-align:center;font-weight:700}
.old{border-style:dashed}
.fold .fh{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.fold .fh h2{margin:0}
.fold .fx{font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.fold .fb{margin-top:12px}
.fold.shut .fb{display:none}
.err{color:var(--err);font-weight:700;min-height:1.3em;margin:8px 0 0}
.tip{background:var(--goldSoft);border:1px solid #ecd9a3;border-radius:12px;padding:10px 12px;font-size:.88rem;margin:12px 0 0}
.off{background:var(--owedSoft);color:var(--owed);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.85rem;margin:12px 0 0}
.prev{background:#1C2B24;color:#fff;text-align:center;font-weight:700;font-size:.85rem;padding:8px}
.ended p{margin:0 0 8px}
.keys button:active{background:var(--soft)}
.keys button:disabled{opacity:.4}
.sigbox{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.modal{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--paper);color:var(--pine);border-radius:18px;padding:18px;max-width:440px;width:100%;max-height:86vh;overflow:auto}
.modal h3{font:700 1.4rem/1.1 "Barlow Condensed",Arial,sans-serif;margin:0 0 8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.modal ul{padding-left:0;list-style:none;margin:0}
.modal li{padding:6px 0;border-bottom:1px solid var(--line)}
.modal li:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1C2B24;color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
.spad{position:fixed;inset:0;z-index:50;background:#fff;color:#14213d}
.spad .stop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;right:14px;font-size:.95rem}
.spad .stop b{font-size:1.05rem}
.spad canvas{position:absolute;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));width:100%;height:auto;touch-action:none}
.spad .ph{position:absolute;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));height:64px;display:flex;align-items:center;justify-content:center;text-align:center;color:#5f6b66;font-size:.95rem;border-top:2px solid #c9d3cd;background:#f7f9f7;touch-action:pan-x pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.spad .ph small{display:block;font-size:.78rem;color:#7a857f;margin-top:2px}
.spad .bar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.spad .bar .btn{flex:1;background:#fff}
.spad .bar .btn.primary{background:#2F6B4F;color:#fff}
.spad .bar .btn:disabled{opacity:.45}
.spad .serr{position:absolute;left:14px;right:14px;bottom:calc(150px + env(safe-area-inset-bottom,0px));color:#B42318;font-weight:700;text-align:center}
@media (orientation:landscape) and (max-height:500px){.spad canvas{top:calc(44px + env(safe-area-inset-top,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px))}.spad .ph{height:52px;bottom:calc(64px + env(safe-area-inset-bottom,0px))}.spad .stop{top:8px}}
.avviso{background:#fff7e0;border:2px solid var(--gold)}
.avviso h2{color:#8a6410}
.avviso p{margin:0;font-weight:600;white-space:pre-line}
.avviso small{color:var(--muted)}
@media (prefers-color-scheme: dark){.avviso{background:var(--goldSoft)}.avviso h2{color:var(--gold)}}
.cal .d.b{background:#dbe8fb;color:#1d4f91;font-weight:700}
.tag.bk{background:#dbe8fb;color:#1d4f91}
@media (prefers-color-scheme: dark){.cal .d.b,.tag.bk{background:#1d3352;color:#a9c8f5}}
</style>

<main id="app"></main>
<script>
/* indirizzo senza la barra finale (…/visuale-cliente?t=…): la aggiungo, così icone, offline e server sono quelli giusti */
if(/\/visuale-cliente$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);
</script>
<script>
/*SIGLIB-START*/
/* ======= v99: FIRME DELLE SEDUTE — codice comune al gestionale e alla pagina del cliente (firma.html) =======
   Una firma è salvata come “tratti” compressi (circa 1 KB), non come foto:
   coordinate in una griglia 1000 × 400, 2 caratteri in base 36 per numero, i tratti separati da “.” */
const SIG_W = 1000;
function sigEncode(strokes){
  const c2 = v => Math.max(0, Math.min(1295, Math.round(v))).toString(36).padStart(2, "0");
  return strokes.filter(s=>s.length).map(s=>s.map(([x,y])=>c2(x) + c2(y)).join("")).join(".");
}
function sigDecode(str){
  return String(str || "").split(".").filter(Boolean).map(s=>{ const pts = [];
    for(let i = 0; i + 3 < s.length; i += 4) pts.push([parseInt(s.slice(i, i+2), 36), parseInt(s.slice(i+2, i+4), 36)]);
    return pts; }).filter(p=>p.length && p.every(([x,y])=>Number.isFinite(x) && Number.isFinite(y)));
}
/* riquadro dove si firma con il dito (o il mouse).
   La firma si salva come tratti (non come foto): stessa scala in orizzontale e in verticale, così non si deforma
   e si può ridisegnare grande o piccola senza sgranare, anche se il riquadro cambia misura (es. a schermo intero). */
const SIG_YMAX = 1295;
function SigPad(canvas, onChange, opt){
  const ctx = canvas.getContext("2d"), strokes = []; let cur = null;
  const touches = new Map(); let pinch = null;                              // opt.pinch(scala, "start"|"move"|"end"): due dita = ingrandisci / rimpicciolisci
  const unit = () => { const r = canvas.getBoundingClientRect(); return Math.min(SIG_W / Math.max(1, r.width), SIG_YMAX / Math.max(1, r.height)); };   // unità della firma per pixel
  const fit = () => { const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * d)); canvas.height = Math.max(1, Math.round(r.height * d)); draw(); };
  const pos = e => { const r = canvas.getBoundingClientRect(), k = unit(); return [(e.clientX - r.left) * k, (e.clientY - r.top) * k]; };
  function draw(){
    const w = canvas.width, h = canvas.height, d = w / Math.max(1, canvas.getBoundingClientRect().width), k = unit();
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#14213d"; ctx.lineWidth = Math.max(2.5, 3 * d);
    const P = v => v / k * d;
    strokes.forEach(s=>{ ctx.beginPath(); s.forEach(([x,y], i)=>{ if(i) ctx.lineTo(P(x), P(y)); else ctx.moveTo(P(x), P(y)); });
      if(s.length === 1){ const [x,y] = s[0]; ctx.lineTo(P(x) + 0.5, P(y)); } ctx.stroke(); });
  }
  const dist = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  canvas.addEventListener("pointerdown", e=>{ e.preventDefault(); try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(opt && opt.pinch && touches.size === 2){                            // secondo dito: niente tratto, si fa lo zoom
      if(cur){ const i = strokes.indexOf(cur); if(i >= 0) strokes.splice(i, 1); cur = null; draw(); }
      pinch = {d0: dist()}; opt.pinch(1, "start"); if(onChange) onChange(); return; }
    if(pinch || touches.size > 1) return;
    cur = [pos(e)]; strokes.push(cur); draw(); if(onChange) onChange(); });
  canvas.addEventListener("pointermove", e=>{
    if(touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch){ e.preventDefault(); if(touches.size === 2) opt.pinch(dist() / pinch.d0, "move"); return; }
    if(!cur) return; e.preventDefault(); const p = pos(e), l = cur[cur.length - 1];
    if(Math.hypot(p[0] - l[0], p[1] - l[1]) >= 3){ cur.push(p); draw(); } });
  const end = e => { touches.delete(e.pointerId);
    if(pinch){ if(!touches.size){ pinch = null; opt.pinch(1, "end"); } return; }
    if(cur){ cur = null; if(onChange) onChange(); } };                       // a fine tratto: “Salva / Invia firma” si attiva
  canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end); canvas.addEventListener("pointerleave", e=>{ if(!pinch) end(e); });
  canvas.style.touchAction = "none";
  return { fit, clear(){ strokes.length = 0; draw(); if(onChange) onChange(); }, isEmpty: () => !strokes.some(s=>s.length > 1) && strokes.length < 2,
    encode: () => sigEncode(strokes), points: () => strokes.reduce((t,s)=>t + s.length, 0) };
}
/* disegna la firma dentro un rettangolo (canvas): usato per tessera, immagini e documenti */
function sigDraw(ctx, str, x, y, w, h, color){
  const st = sigDecode(str); if(!st.length) return;
  const xs = st.flat().map(p=>p[0]), ys = st.flat().map(p=>p[1]);
  const bx = Math.min(...xs), by = Math.min(...ys), bw = Math.max(40, Math.max(...xs) - bx), bh = Math.max(30, Math.max(...ys) - by);
  const k = Math.min(w / bw, h / bh), ox = x + (w - bw * k) / 2, oy = y + (h - bh * k) / 2;
  ctx.save(); ctx.strokeStyle = color || "#14213d"; ctx.lineWidth = Math.max(1.2, Math.min(w, h) / 22); ctx.lineCap = "round"; ctx.lineJoin = "round";
  st.forEach(s=>{ ctx.beginPath(); s.forEach(([px,py], i)=>{ const X = ox + (px - bx) * k, Y = oy + (py - by) * k; if(i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }); if(s.length === 1) ctx.lineTo(ox + (s[0][0] - bx) * k + 1, oy + (s[0][1] - by) * k); ctx.stroke(); });
  ctx.restore();
}
/* traguardi della tessera presenze */
function sigWeekKey(iso){ const d = new Date(iso + "T12:00:00Z"), day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day); return d.toISOString().slice(0,10); }
/* STATUS del cliente in base alle sedute fatte con te: uno ogni 25 fino a 200, poi ogni 50 fino a 500 (VIP Platino) */
const SIG_STATUS = [[25,"🥉","Bronzo","Bronze"],[50,"🥈","Argento","Silver"],[75,"🥇","Oro","Gold"],[100,"💚","Smeraldo","Emerald"],[125,"💙","Zaffiro","Sapphire"],
  [150,"❤️","Rubino","Ruby"],[175,"💜","Ametista","Amethyst"],[200,"💎","Diamante","Diamond"],[250,"💠","Diamante Blu","Blue Diamond"],[300,"⚙️","Titanio","Titanium"],
  [350,"🖤","Carbonio","Carbon"],[400,"⭐","Elite","Elite"],[450,"🏛️","Leggenda","Legend"],[500,"👑","VIP Platino","Platinum VIP"]];
function sigStatus(all, en){ const r = SIG_STATUS.filter(x=>(Number(all) || 0) >= x[0]).pop(); return r ? {n:r[0], e:r[1], name: en ? r[3] : r[2]} : null; }
function sigStatusNext(all, en){ const r = SIG_STATUS.find(x=>x[0] > (Number(all) || 0)); return r ? {n:r[0], e:r[1], name: en ? r[3] : r[2]} : null; }
/* traguardi della tessera (con emoji): pacchetto, settimane di fila, status */
function sigBadges(o){                                  // o: {total, used, dates:[date sedute FATTE], allTime, lang, single}
  const out = [], dates = (o.dates || []).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d || "")), used = Number(o.used) || dates.length, t = o.total || 0, L = o.lang === "en", all = Number(o.allTime) || 0;
  if(!o.single){
    if(t > 1 && used >= t) out.push(L ? "🏆 Package completed! 🎉" : "🏆 Pacchetto completato! 🎉");
    else if(t > 1 && used >= Math.ceil(t / 2)) out.push(L ? "🎉 You're halfway through the package! 🎯" : "🎉 Sei a metà pacchetto! 🎯");
    const run = sigWeekRun(dates);
    if(run >= 2) out.push(L ? `🏅 ${run} weeks in a row 🗓️🔥💪` : `🏅 ${run} settimane di fila 🗓️🔥💪`);
  }
  const st = sigStatus(all, L);
  if(st) out.push(L ? `${st.e} ${st.name} status: ${all} sessions together 🤝💯🌟` : `${st.e} Status ${st.name}: ${all} sedute insieme 🤝💯🌟`);
  else if(all >= 10) out.push(L ? `🏅 ${all} sessions together 🤝💯🌟` : `🏅 ${all} sedute insieme 🤝💯🌟`);
  return out;
}
/* settimane di fila (fino all'ultima data) */
function sigWeekRun(dates){
  const weeks = [...new Set((dates || []).filter(Boolean).map(sigWeekKey))].sort(); if(!weeks.length) return 0;
  let run = 1; for(let i = weeks.length - 1; i > 0; i--){ const a = new Date(weeks[i] + "T12:00:00Z"), b = new Date(weeks[i-1] + "T12:00:00Z"); if(Math.round((a - b) / 864e5) === 7) run++; else break; }
  return run;
}
/* tessera presenze (immagine): nome, pacchetto attivo, frase del giorno, firma della seduta, progressi,

  /* copia sul telefono (per vedere la pagina anche senza internet): dati + impronta del PIN */

  /* risposta del server -> schermata giusta */

    if(r.status === 410) return S.removed();
    if(r.status === 429) return S.toomany();
    if(r.status === 404 && !j.error) return S.removed();          // la funzione non c'è più sul server: link scaduto (e cancello la copia sul telefono)
    if(r.status === 404 || r.status === 400 && j.error === "device") return S.nolink();
    if(r.status >= 500) return offlineOr(S.nonet);
    switch(j.state){
      case "new": setK(""); lsDel(CK); return S.welcome(j);
      case "waiting": return S.waiting(j);
      case "setpin": setK(""); lsDel(CK); return pinScreen("set");
      case "pin": setK(""); return pinScreen("pin");
      case "removed": return S.removed();
      case "expired": return S.expired();
      case "blocked": setK(""); return S.blocked();
      case "ok":
        if(j.k) setK(j.k);

  }

  /* ---------------- la pagina del cliente ---------------- */

      const done = p ? Number(p.done) || 0 : 0, used = p ? done + (Number(p.lost) || 0) : 0;
      const badges = sigBadges({total: p ? p.total : 0, used, dates: rows.filter(r=>!r.miss).map(r=>r.date), allTime: d.allTime, lang: L ? "en" : "it", single: !p});
      h += card("goal", `${T("I tuoi traguardi", "Your milestones")} 🏆✨`, `<ul class="badges">${badges.map(b=>`<li>${esc(b)}</li>`).join("")}${st ? "" : `<li>💪 ${d.allTime} ${d.allTime === 1 ? T("seduta fatta in tutto", "session done in total") : T("sedute fatte in tutto", "sessions done in total")}</li>`}${nx ? `<li class="next">⚪ ${T("Prossimo status", "Next status")}: ${nx.e} ${esc(nx.name)} ${T("a", "at")} ${nx.n} ${T("sedute", "sessions")} (${T(`ne mancano ${nx.n - d.allTime}`, `${nx.n - d.allTime} to go`)}) 🔒🚀</li>` : ""}</ul>
        ${curOpt.preview ? "" : `<p><button class="btn sm" id="gShare">📤 ${T("Condividi traguardo", "Share milestone")}</button></p>`}`);
    }
    /* 7. firme: firmata (👁 per vederla, solo visione) oppure da firmare */
    if(p && on(d, "firme") && rows.length){
      h += card("firme", `${T("Le tue firme", "Your signatures")} ✍️`, `<div class="rows">${rows.slice().reverse().map(r=>{ const g = sigs[r.id];
        return `<div class="r"><span>${dIt(r.date)}${r.miss ? ` <small>· ${T("saltata", "missed")}</small>` : ""}</span>${g ? `<span><span class="tag ok">✔ ${T("firmata", "signed")}</span> <button class="eye" data-eye="${esc(r.id)}" aria-label="${T("Vedi la firma", "View signature")}" aria-pressed="${openEye === r.id}">👁</button></span>` : `<button class="btn sm primary" data-sign="${esc(r.id)}"${curOpt.preview || curOpt.offline ? " disabled" : ""}>✍️ ${T("Firma", "Sign")}</button>`}</div>${g && openEye === r.id ? `<div class="sigbox"><canvas data-s="${esc(g.s)}" aria-label="${T("Firma", "Signature")}"></canvas><span class="wm">${T("SOLO VISIONE", "VIEW ONLY")}</span></div>` : ""}`; }).join("")}</div>
        <p class="msum">${T("Puoi firmare le sedute non ancora firmate. Quelle già firmate non si possono cambiare.", "You can sign the sessions not signed yet. Signed ones can't be changed.")}</p>`);
    }
    /* 8. pacchetto precedente (per 3 giorni) */
    const o = d.old;
    if(o && (!o.until || o.until >= todayIso())) h += card("old", T("Pacchetto precedente", "Previous package"), `<p style="margin:0">${o.start ? dIt(o.start) + " → " : ""}${dIt(o.end)} · ${o.done} ${T("su", "of")} ${o.total} ${T("sedute", "sessions")}${o.lost ? ` · ${o.lost} ${o.lost === 1 ? T("saltata", "missed") : T("saltate", "missed")}` : ""}</p>${o.until && p ? `<p class="msum">${T("Visibile fino al", "Visible until")} ${dIt(o.until)}</p>` : ""}`, "old");
    if(!curOpt.preview) h += `<div class="foot"><button class="btn sm" id="fOut">🚪 ${T("Esci da questo dispositivo", "Log out of this device")}</button><button class="btn sm" id="fDel">🗑 ${T("Chiedi di cancellare i miei dati", "Ask to delete my data")}</button></div>`;
    h += `</div>`;
    app.innerHTML = h;
    document.querySelectorAll("canvas[data-s]").forEach(drawSig);
    window.scrollTo(0, keep);
  }
  /* tocchi nella pagina */
  app.addEventListener("click", async e=>{
    const fh = e.target.closest(".fh");
    if(fh){ const sec = fh.closest(".fold"), k = sec.dataset.k, shut = !sec.classList.contains("shut");
      sec.classList.toggle("shut", shut); fh.setAttribute("aria-expanded", String(!shut)); fh.querySelector(".fx").textContent = shut ? T("Mostra", "Show") + " ▾" : T("Nascondi", "Hide") + " ▴";
      folds[k] = shut; lsSet(FOLD_KEY, folds);
      if(!shut) sec.querySelectorAll("canvas[data-s]").forEach(drawSig); return; }
    const b = e.target.closest("button"); if(!b || !cur) return;
    if(b.dataset.eye !== undefined){ openEye = openEye === b.dataset.eye ? "" : b.dataset.eye; render(); return; }
    if(b.dataset.sign !== undefined){ if(!curOpt.preview && !curOpt.offline) signPad(b.dataset.sign); return; }
    if(b.id === "cPrev"){ calIdx = Math.max(0, calIdx - 1); render(); return; }
    if(b.id === "cNext"){ calIdx++; render(); return; }
    if(b.id === "hHelp") return guide();
    if(b.id === "gShare") return share();
    if(b.id === "hOut"){ if(curOpt.offline){ cur = null; return pinScreen("offline"); } try{ await api("POST", {op:"bye", k: K}); }catch(_){} setK(""); cur = null; stopWatch(); return boot(); }
    if(b.id === "fOut"){
      if(!(await ask(T("Scollegare questo dispositivo?", "Disconnect this device?"), T("Per rivedere la pagina dovrai chiedere di nuovo l'accesso e il tuo personal trainer dovrà approvarlo.", "To see the page again you'll have to request access again and your personal trainer will have to approve it."), T("Scollega", "Disconnect")))) return;
      try{ const r = await api("POST", {op:"logout", k: K}); if(r.status >= 400 && r.status !== 403) throw 0; }catch(_){ return toast(T("Non riesco a collegarmi: riprova.", "I can't connect: try again.")); }
      cacheClear(); cur = null; stopWatch(); return boot();
    }
    if(b.id === "fDel"){
      if(!(await ask(T("Chiedere di cancellare i tuoi dati?", "Ask to delete your data?"), T("Il tuo personal trainer riceverà la richiesta di cancellare i dati di questa pagina e deciderà lui.", "Your personal trainer will receive the request to delete the data on this page and will decide."), T("Invia richiesta", "Send request")))) return;
      try{ const r = await api("POST", {op:"delreq", k: K}); if(!r.j.ok) throw 0; toast(T("Richiesta inviata al tuo personal trainer.", "Request sent to your personal trainer.")); }
      catch(_){ toast(T("Non riesco a collegarmi: riprova.", "I can't connect: try again.")); }
    }
  });
  app.addEventListener("contextmenu", e=>{ if(e.target.closest(".sigbox")) e.preventDefault(); });
  /* firma dalla pagina: riquadro a tutto schermo */
  function signPad(id){
    const r = (cur.rows || []).find(x=>x.id === id); if(!r) return;
    const box = document.createElement("div"); box.className = "spad"; box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true");
    box.innerHTML = `<div class="stop"><b>${r.miss ? T("Lezione saltata del", "Missed lesson on") : T("Seduta del", "Session on")} ${dIt(r.date)}</b><br>${T("Firma con il dito sopra la linea. Se vuoi, gira il telefono in orizzontale.", "Sign with your finger above the line. You can turn your phone sideways.")}</div>
      <canvas id="sCv" aria-label="${T("Riquadro per firmare", "Signature box")}"></canvas><div class="ph"><span>${T("↑ Firma con il dito sopra la linea", "↑ Sign with your finger above the line")}<small>${T("qui sotto puoi scorrere e ingrandire", "down here you can scroll and zoom")}</small></span></div>
      <p class="serr" id="sErr" role="alert"></p>
      <div class="bar"><button class="btn" id="sNo">${T("Annulla", "Cancel")}</button><button class="btn" id="sClr">${T("Cancella", "Clear")}</button><button class="btn primary" id="sOk" disabled>✔ ${T("Invia firma", "Send signature")}</button></div>`;
    document.body.appendChild(box); document.body.style.overflow = "hidden"; hideVeil(); pauseVeil = true;
    const pad = SigPad($("sCv"), ()=>{ $("sOk").disabled = pad.points() < 3; $("sErr").textContent = ""; });
    const fit = () => pad.fit(); requestAnimationFrame(fit); window.addEventListener("resize", fit);
    const close = () => { window.removeEventListener("resize", fit); box.remove(); document.body.style.overflow = ""; pauseVeil = false; poke(); };
    $("sNo").onclick = close; $("sClr").onclick = () => pad.clear();
    $("sOk").onclick = async () => {
      const s = pad.encode(); if(s.length < 8) return;
      $("sOk").disabled = true;
      let rr;
      try{ rr = await api("POST", {op:"sign", k: K, id, s}); }catch(_){ $("sOk").disabled = false; $("sErr").textContent = T("Non riesco a inviare: controlla la connessione e riprova.", "I can't send it: check your connection and try again."); return; }
      if(rr.j.ok){ curSigs[id] = {s, via:"client"}; close(); render(); toast(`✅ ${T("Firma inviata. Grazie!", "Signature sent. Thank you!")}`); refresh(); return; }
      if(rr.status === 409){ close(); toast(T("Questa seduta è già firmata.", "This session is already signed.")); refresh(); return; }
      if(rr.j.state === "pin"){ close(); return handle(rr); }
      $("sOk").disabled = false; $("sErr").textContent = T("Qualcosa non va: riprova.", "Something went wrong: try again.");
    };
  }
  /* guida rapida */
  function guide(){
    const m = document.createElement("div"); m.className = "modal";
    const it = [["📈", T("<b>Progressi</b>: i pallini verdi sono le sedute fatte, gli arancioni le lezioni saltate.", "<b>Progress</b>: green dots are sessions done, orange ones are missed lessons.")],
      ["✍️", T("<b>Firme</b>: puoi firmare le sedute non ancora firmate. Quelle firmate si vedono con 👁 e non si possono cambiare.", "<b>Signatures</b>: you can sign sessions not signed yet. Signed ones open with 👁 and can't be changed.")],
      ["▾", T("<b>Mostra / Nascondi</b>: tocca il titolo di una sezione per aprirla o chiuderla.", "<b>Show / Hide</b>: tap a section title to open or close it.")],
      ["🔄", T("La pagina si aggiorna da sola ogni volta che il tuo personal trainer cambia qualcosa.", "The page updates by itself every time your personal trainer changes something.")],
      ["🙈", T("Per la tua privacy la pagina si copre dopo 2 minuti senza tocchi o quando cambi app: tocca per rivederla.", "For your privacy the page is covered after 2 minutes without touches or when you switch app: tap to see it again.")],
      ["🔒", T("<b>Esci</b> chiude la pagina: per riaprirla serve il PIN. Hai dimenticato il PIN? Chiedi al tuo personal trainer di azzerarlo.", "<b>Log out</b> closes the page: you need your PIN to reopen it. Forgot it? Ask your personal trainer to reset it.")],
      ["📲", kind === "Android" ? T("Icona sul telefono: menu ⋮ del browser → «Aggiungi a schermata Home».", "Icon on your phone: browser menu ⋮ → “Add to Home screen”.") : T("Icona sul telefono: tasto Condividi ⬆️ → «Aggiungi alla schermata Home».", "Icon on your phone: Share ⬆️ → “Add to Home Screen”.")],
      ["📶", T("Funziona anche senza internet: vedi l'ultima situazione salvata.", "It also works offline: you see the last saved situation.")]];
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${T("Guida rapida", "Quick guide")}</h3><ul>${it.map(([e, t])=>`<li>${e} ${t}</li>`).join("")}</ul><div class="acts"><button class="btn primary">OK</button></div></div>`;
    m.addEventListener("click", e=>{ if(e.target === m || e.target.closest("button")) m.remove(); });
    document.body.appendChild(m);
  }
  /* condividi traguardo: immagine con lo status (senza firme né soldi) */
  async function share(){
    const d = cur, st = sigStatus(d.allTime, L), p = d.pkg, c = document.createElement("canvas"); c.width = c.height = 1080;
    const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 1080, 1080); g.addColorStop(0, "#2F6B4F"); g.addColorStop(1, "#1C3D2D");
    x.fillStyle = g; x.fillRect(0, 0, 1080, 1080); x.textAlign = "center"; x.fillStyle = "#fff";
    try{ if(document.fonts && document.fonts.load) await Promise.race([Promise.all([document.fonts.load('700 90px "Barlow Condensed"'), document.fonts.load("600 40px Barlow")]), new Promise(r=>setTimeout(r, 1500))]); }catch(_){}
    const done = p && p.total > 0 && (Number(p.done) || 0) + (Number(p.lost) || 0) >= p.total;
    x.font = "260px system-ui, 'Apple Color Emoji', 'Noto Color Emoji', sans-serif"; x.fillText(st ? st.e : (done ? "🏆" : "💪"), 540, 420);
    x.font = '700 104px "Barlow Condensed", Arial, sans-serif';
    x.fillText(st ? (L ? `${st.name} client` : `Cliente ${st.name}`) : (done ? T("Pacchetto completato!", "Package completed!") : T("Avanti così!", "Keep going!")), 540, 590);
    x.font = '600 52px Barlow, Arial, sans-serif'; x.fillStyle = "#e9f3ec";
    x.fillText(`${d.allTime} ${d.allTime === 1 ? T("seduta completata", "session completed") : T("sedute completate", "sessions completed")} 💪`, 540, 690);
    if(st && done) x.fillText(T("e pacchetto completato! 🏆", "and package completed! 🏆"), 540, 770);
    x.font = '500 40px Barlow, Arial, sans-serif'; x.fillStyle = "#cfe3d6";
    x.fillText(`${T("Il mio percorso", "My journey")}${d.trainer ? (L ? " with " : " con ") + d.trainer : ""} · ${dIt(todayIso())}`, 540, 960);
    const blob = await new Promise(r=>c.toBlob(r, "image/png")), name = T("Il mio traguardo", "My milestone") + ".png";
    try{ const f = new File([blob], name, {type:"image/png"}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title: T("Il mio traguardo", "My milestone")}); return; } }catch(e){ if(e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast(T("Immagine salvata: ora puoi condividerla.", "Image saved: now you can share it."));
  }
  /* aggiornamento automatico (ogni minuto, quando la pagina è aperta) */
  let watch = 0;
  async function refresh(){
    if(!cur || curOpt.offline || !K) return;
    let r; try{ r = await api("GET", null, "&k=" + encodeURIComponent(K)); }catch(_){ return; }
    if(r.j.state === "ok"){ cacheSave(r.j.data, r.j.sigs); if(JSON.stringify([r.j.data, r.j.sigs]) !== JSON.stringify([cur, curSigs])) showPage(r.j.data, r.j.sigs || {}, {}); return; }
    if(document.querySelector(".spad")) return;
    stopWatch(); cur = null; handle(r);
  }
  function startWatch(){ stopWatch(); watch = setInterval(()=>{ if(document.visibilityState === "visible") refresh(); }, 60000); }
  function stopWatch(){ clearInterval(watch); watch = 0; }
  /* velo per la privacy: dopo 2 minuti senza tocchi o quando cambi app */
  let idle = 0, pauseVeil = false;
  const veilOn = () => !!cur && !curOpt.preview && !demo && !pauseVeil;
  function showVeil(){ if(!veilOn() || $("veil")) return; document.body.insertAdjacentHTML("beforeend", `<div class="veil" id="veil" role="button" tabindex="0"><div><div class="big-ic">🙈</div>${T("Pagina nascosta", "Page hidden")}<br><small style="font-weight:500">${T("Tocca per vederla", "Tap to show it")}</small></div></div>`); }
  function hideVeil(){ const v = $("veil"); if(v) v.remove(); }
  function poke(){ clearTimeout(idle); if(veilOn()) idle = setTimeout(showVeil, 120000); }
  document.addEventListener("click", e=>{ if(e.target.closest("#veil")){ hideVeil(); refresh(); } poke(); }, true);
  ["touchstart", "keydown", "scroll", "pointermove"].forEach(ev=>document.addEventListener(ev, poke, {passive:true, capture:true}));
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") showVeil(); else if(cur && !curOpt.offline) refresh(); });
  window.addEventListener("pagehide", showVeil);
  window.addEventListener("resize", ()=>{ if(cur) document.querySelectorAll("canvas[data-s]").forEach(drawSig); });

  /* ---------------- anteprima dal gestionale e pagina di esempio ---------------- */
  window.__preview = (data, sigs) => { showPage(data, sigs || {}, {preview: true}); };
  if(preview){ gate(`<div class="center"><p>${T("Anteprima…", "Preview…")}</p></div>`); try{ if(window.parent && window.parent !== window) window.parent.postMessage({ptPreviewReady: true}, location.origin); }catch(_){} return; }
  if(demo){
    const fake = () => { const st = []; let s = []; for(let t = 0; t <= 1; t += 0.02){ s.push([60 + t * 560, 230 - 60 * Math.sin(t * 18) * Math.exp(-t * 0.6) - 40 * Math.cos(t * 7)]); } st.push(s); st.push([[120,300],[880,280]]); return sigEncode(st); };
    who = {trainer: "Giovanni Esposito", first: "Mario"};
    const rows = [{id:"a", date:"2026-11-02"}, {id:"b", date:"2026-11-03"}, {id:"c", date:"2026-11-04", miss:true}, {id:"d", date:"2026-11-05"}, {id:"e", date:"2026-11-06"}, {id:"f", date:"2026-11-07"}];
    const D = {v:1, upd:"2026-11-08T10:40", trainer:"Giovanni Esposito", first:"Mario", msg:"Bravo Mario! Questa settimana lavoriamo sulla postura: ricordati lo stretching a casa 💪",
      sec:{prog:true, cal:true, miss:true, pay:true, goal:true, firme:true}, active:true, ended:"",
      pkg:{start:"2026-11-02", total:12, done:5, lost:1, price:450, paid:300, due:150, noDate:0}, rows,
      pays:[{date:"2026-11-02", amount:150, method:"Contanti"}, {date:"2026-11-07", amount:150, method:"Bonifico"}], allTime:52,
      days: rows.map(r=>[r.date, r.miss ? "m" : "s"]).concat([["2026-10-06","s"],["2026-10-09","s"],["2026-10-13","s"],["2026-10-16","s"],["2026-10-20","s"],["2026-10-23","s"],["2026-10-27","s"],["2026-10-30","s"]]),
      old:{start:"2026-09-01", end:"2026-10-30", done:10, total:10, lost:0, until:"2099-11-02"}, book:[{date:"2099-11-10", time:"18:00", type:"pt"}, {date:"2099-11-12", time:"09:30", type:"ck"}], singles:["2026-10-31", "2026-10-28"]};
    const sg = {a:{s:fake()}, b:{s:fake()}, c:{s:fake()}, d:{s:fake()}, f:{s:fake()}};
    if(demo === "welcome") return S.welcome({first: "Mario"});
    if(demo === "wait") return S.waiting({name: "Telefono di Mario"});
    if(demo === "setpin") return pinScreen("set");
    if(demo === "pin") return pinScreen("pin");
    if(S[demo]) return S[demo]();
    if(demo === "veil"){ showPage(D, sg, {}); document.body.insertAdjacentHTML("beforeend", `<div class="veil"><div><div class="big-ic">🙈</div>${T("Pagina nascosta", "Page hidden")}<br><small style="font-weight:500">${T("Tocca per vederla", "Tap to show it")}</small></div></div>`); return; }
    news = [T("💪 +1 seduta (l'ultima il 07/11/2026)", "💪 +1 session (the last on 07/11/2026)"), T("💶 Pagamento registrato: 150,00 €", "💶 Payment recorded: €150.00"), T("✍️ 1 seduta da firmare", "✍️ 1 session to sign")];
    return showPage(D, sg, {});
  }
  /* pagina vera: funziona anche offline (service worker solo per questa pagina) */
  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    navigator.serviceWorker.register("sw.js", {scope: "./"}).catch(()=>{});
  }
  boot();
})();
</script>
