<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Firma della seduta</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--moss:#2F6B4F;--muted:#5f6b66;--line:#d8ddd9;--bg:#f4f6f3;--paper:#fff;--err:#B42318}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.top{height:6px;background:var(--moss);border-radius:16px 16px 0 0;margin:-20px -18px 16px}
.who{color:var(--muted);font-size:.9rem;margin:0 0 6px}
h1{font-size:1.6rem;line-height:1.15;margin:0 0 4px}
.what{font-size:1.15rem;font-weight:700;margin:0}
.sub{color:var(--muted);margin:2px 0 16px}
.pad{position:relative;border:2px dashed #9fb3a8;border-radius:14px;background:#fff;height:clamp(300px,60vh,560px);margin:6px 0 12px}
.turn{display:flex;align-items:center;gap:12px;background:#eef6f0;border:1.5px solid #9fb3a8;border-radius:12px;padding:12px 14px;margin:4px 0 12px;font-weight:700;color:var(--moss)}
.turn .ic{font-size:1.8rem;line-height:1}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 4px}
.tools .zb{min-width:52px;padding:8px 0;font-size:1.3rem;line-height:1}
.tools .fsb{flex:1;padding:10px 12px;font-size:.95rem;background:#f4f6f3;border-color:#9fb3a8}
.tools .zl{color:var(--muted);font-size:.85rem;min-width:3.2em;text-align:center}
.tools .lnd{display:none}
@media (orientation:landscape){
  .turn,.who,.row.bottom{display:none}
  main{max-width:none;padding:6px 28px 24px}
  .card{padding:10px 14px}
  .top{margin:-10px -14px 8px;height:5px}
  .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:6px}
  h1{font-size:1.1rem;margin:0}
  .what{font-size:.95rem;margin:0}
  .sub{margin:0;font-size:.9rem}
  .tools{gap:6px}
  .tools .zb{min-width:44px;min-height:40px;padding:4px 0;font-size:1.1rem}
  .tools button{min-height:40px;padding:6px 12px}
  .tools .fsb{flex:0 1 auto}
  .tools .lnd{display:inline-block}
  .tools .sp{flex:1}
  .pad{margin:6px 0 8px}
}
.pad.full{position:fixed;inset:0;z-index:50;height:auto;margin:0;border:none;border-radius:0}
.pad .padbar{display:none;position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));gap:10px}
.pad.full .padbar{display:flex}
.pad.full canvas{bottom:calc(140px + env(safe-area-inset-bottom,0px));height:auto}
.pad.full .ph{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.pad .padtop{display:none;pointer-events:none;position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;right:14px;color:#5f6b66;font-size:.9rem}
.pad.full .padtop{display:block}
.big{width:100%;margin:0 0 10px;background:#f4f6f3;border-color:#9fb3a8}
/* sopra la linea si firma; sotto la linea (fascia con la scritta) si scorre e si ingrandisce la pagina, come nel resto della pagina */
.pad canvas{position:absolute;left:0;top:0;right:0;bottom:64px;width:100%;height:calc(100% - 64px);border-radius:12px 12px 0 0;touch-action:none}
.pad .ph{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:center;text-align:center;color:#5f6b66;font-size:.95rem;
  border-top:2px solid #c9d3cd;background:#f7f9f7;border-radius:0 0 12px 12px;touch-action:pan-x pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.pad .ph b{display:none}
.pad .ph small{display:block;font-size:.78rem;color:#7a857f;margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border-radius:12px;padding:13px 18px;min-height:48px;cursor:pointer;border:1.5px solid var(--ink);background:#fff;color:var(--ink)}
button.primary{background:var(--moss);border-color:var(--moss);color:#fff;flex:1}
button:disabled{opacity:.45;cursor:default}
.err{color:var(--err);font-weight:600;min-height:1.2em;margin:10px 0 0}
.done{text-align:center}
.done h1{margin-top:4px}
#cardImg{width:100%;height:auto;border:1px solid var(--line);border-radius:14px;margin:14px 0}
.muted{color:var(--muted);font-size:.9rem}
/* v105 (privacy): documento privacy del cliente */
.pv-ovl{position:fixed;inset:0;background:rgba(10,20,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:2147483000;padding:12px}
.pv-box{background:#fff;color:#1d2a22;border-radius:22px;max-width:460px;width:100%;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;text-align:left;font-family:inherit}
.pv-box.pv-done{height:calc(100vh - 24px);height:calc(100dvh - 24px)}
.pv-scroll{overflow-y:auto;padding:22px 20px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
.pv-head{padding:18px 20px 6px}
.pv-ic{font-size:2rem;line-height:1}
.pv-h{margin:8px 0 2px;font-size:1.35rem;line-height:1.2;color:#1d2a22}
.pv-okh{color:#2f6b3f;margin-top:0}
.pv-sub{margin:0 0 14px;color:#6a786f;font-size:.85rem}
.pv-p{margin:0 0 10px;font-size:1rem;line-height:1.45;color:#1d2a22}
.pv-small{font-size:.88rem;color:#4a5a50}
.pv-ul{margin:0 0 10px 18px;padding:0;line-height:1.5;color:#1d2a22}
.pv-doc{display:flex;align-items:center;gap:12px;margin:14px 0 10px;padding:12px 14px;border:1.5px solid #2F6B4F;border-radius:14px;background:#f1f7f3;color:#1d2a22;text-decoration:none}
.pv-dic{font-size:1.7rem;line-height:1}.pv-doc b{display:block}.pv-doc small{display:block;color:#5f6b66;font-size:.82rem}.pv-go{margin-left:auto;font-size:1.6rem;color:#2F6B4F}
.pv-foot{padding:12px 20px 16px;border-top:1px solid #e3e8e4;background:#fff;flex:0 0 auto}
.pv-row{display:flex;gap:10px}
.pv-ok{width:100%;padding:14px;border:0;border-radius:14px;background:#2F6B4F;color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.pv-btn{flex:0 0 auto;padding:14px 16px;border:1.5px solid #c9d2cc;border-radius:14px;background:#fff;color:#1d2a22;font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.pv-ok:disabled{opacity:.5;cursor:default}
.pv-pad{position:relative;border:2px dashed #9fb3a8;border-radius:14px;background:#fff;height:clamp(200px,38vh,320px);margin:12px 0 4px}
.pv-pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pv-ph{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#9aa6a0;font-size:.85rem;pointer-events:none}
.pv-err{margin:8px 0 0;text-align:center;color:#B42318;font-size:.85rem;font-weight:700}
/* il modulo (vista nella pagina) */
.pd-doc{font-family:Helvetica,Arial,sans-serif;color:#000;font-size:.86rem;line-height:1.45}
.pd-bar{height:1.5px;background:#000;margin:0 0 10px}
.pd-big{font-size:1.25rem;font-weight:800;letter-spacing:.06em;margin:0 0 2px;color:#000}
.pd-h{font-size:1.02rem;line-height:1.25;margin:0 0 3px;color:#000}
.pd-sub{color:#6b6b6b;font-size:.74rem;margin:0 0 10px}
.pd-p{margin:0 0 7px}.pd-cons{font-weight:700;margin:10px 0 0}
.pd-sig{margin-top:14px;border-top:1px solid #9a9a9a;padding-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;align-items:end}
.pd-f small{display:block;color:#000;font-size:.9rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em}.pd-f b{display:block;min-height:1.4em;border-bottom:1px solid #000;padding:2px 0;font-size:.86rem}
.pd-sg{grid-column:2;grid-row:1 / span 2;padding:16px 0 0 14px}.pd-sg small{font-size:1rem}.pd-img{height:88px;border-bottom:1.5px solid #000}.pd-img canvas{width:100%;height:100%;display:block}
.pd-g{color:#6b6b6b}.pd-foot{margin:12px 0 0;color:#6b6b6b;font-size:.7rem}
</style>
</head>
<body>
<main>
  <div class="card" id="box"><div class="top"></div><p id="msg">Caricamento…</p></div>
</main>
<script>
/*SIGLIB-START*/
/* ======= v99: FIRME DELLE SEDUTE — codice comune al gestionale e alla pagina del cliente (firma.html) =======
   Una firma è salvata come “tratti” compressi (circa 1 KB), non come foto:
   coordinate in una griglia 1000 × 400, 2 caratteri in base 36 per numero, i tratti separati da “.” */
const SIG_W = 1000;
function sigEncode(strokes){
  const c2 = v => Math.max(0, Math.min(1295, Math.round(v))).toString(36).padStart(2, "0");
  return strokes.filter(s=>s.length).map(s=>s.map(([x,y])=>c2(x) + c2(y)).join("")).join(".");
}
function sigDecode(str){
  return String(str || "").split(".").filter(Boolean).map(s=>{ const pts = [];
    for(let i = 0; i + 3 < s.length; i += 4) pts.push([parseInt(s.slice(i, i+2), 36), parseInt(s.slice(i+2, i+4), 36)]);
    return pts; }).filter(p=>p.length && p.every(([x,y])=>Number.isFinite(x) && Number.isFinite(y)));
}
/* riquadro dove si firma con il dito (o il mouse).
   La firma si salva come tratti (non come foto): stessa scala in orizzontale e in verticale, così non si deforma
   e si può ridisegnare grande o piccola senza sgranare, anche se il riquadro cambia misura (es. a schermo intero). */
const SIG_YMAX = 1295;
function SigPad(canvas, onChange, opt){
  const ctx = canvas.getContext("2d"), strokes = []; let cur = null;
  const touches = new Map(); let pinch = null;                              // opt.pinch(scala, "start"|"move"|"end"): due dita = ingrandisci / rimpicciolisci
  const unit = () => { const r = canvas.getBoundingClientRect(); return Math.min(SIG_W / Math.max(1, r.width), SIG_YMAX / Math.max(1, r.height)); };   // unità della firma per pixel
  const fit = () => { const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * d)); canvas.height = Math.max(1, Math.round(r.height * d)); draw(); };
  const pos = e => { const r = canvas.getBoundingClientRect(), k = unit(); return [(e.clientX - r.left) * k, (e.clientY - r.top) * k]; };
  function draw(){
    const w = canvas.width, h = canvas.height, d = w / Math.max(1, canvas.getBoundingClientRect().width), k = unit();
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#14213d"; ctx.lineWidth = Math.max(2.5, 3 * d);
    const P = v => v / k * d;
    strokes.forEach(s=>{ ctx.beginPath(); s.forEach(([x,y], i)=>{ if(i) ctx.lineTo(P(x), P(y)); else ctx.moveTo(P(x), P(y)); });
      if(s.length === 1){ const [x,y] = s[0]; ctx.lineTo(P(x) + 0.5, P(y)); } ctx.stroke(); });
  }
  const dist = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  canvas.addEventListener("pointerdown", e=>{ e.preventDefault(); try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(opt && opt.pinch && touches.size === 2){                            // secondo dito: niente tratto, si fa lo zoom
      if(cur){ const i = strokes.indexOf(cur); if(i >= 0) strokes.splice(i, 1); cur = null; draw(); }
      pinch = {d0: dist()}; opt.pinch(1, "start"); if(onChange) onChange(); return; }
    if(pinch || touches.size > 1) return;
    cur = [pos(e)]; strokes.push(cur); draw(); if(onChange) onChange(); });
  canvas.addEventListener("pointermove", e=>{
    if(touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch){ e.preventDefault(); if(touches.size === 2) opt.pinch(dist() / pinch.d0, "move"); return; }
    if(!cur) return; e.preventDefault(); const p = pos(e), l = cur[cur.length - 1];
    if(Math.hypot(p[0] - l[0], p[1] - l[1]) >= 3){ cur.push(p); draw(); } });
  const end = e => { touches.delete(e.pointerId);
    if(pinch){ if(!touches.size){ pinch = null; opt.pinch(1, "end"); } return; }
    if(cur){ cur = null; if(onChange) onChange(); } };                       // a fine tratto: “Salva / Invia firma” si attiva
  canvas.addEventListener("pointerup", end); canvas.addEventListener("pointercancel", end); canvas.addEventListener("pointerleave", e=>{ if(!pinch) end(e); });
  canvas.style.touchAction = "none";
  return { fit, clear(){ strokes.length = 0; draw(); if(onChange) onChange(); }, isEmpty: () => !strokes.some(s=>s.length > 1) && strokes.length < 2,
    encode: () => sigEncode(strokes), points: () => strokes.reduce((t,s)=>t + s.length, 0) };
}
/* disegna la firma dentro un rettangolo (canvas): usato per tessera, immagini e documenti */
function sigDraw(ctx, str, x, y, w, h, color){
  const st = sigDecode(str); if(!st.length) return;
  const xs = st.flat().map(p=>p[0]), ys = st.flat().map(p=>p[1]);
  const bx = Math.min(...xs), by = Math.min(...ys), bw = Math.max(40, Math.max(...xs) - bx), bh = Math.max(30, Math.max(...ys) - by);
  const k = Math.min(w / bw, h / bh), ox = x + (w - bw * k) / 2, oy = y + (h - bh * k) / 2;
  ctx.save(); ctx.strokeStyle = color || "#14213d"; ctx.lineWidth = Math.max(1.2, Math.min(w, h) / 22); ctx.lineCap = "round"; ctx.lineJoin = "round";
  st.forEach(s=>{ ctx.beginPath(); s.forEach(([px,py], i)=>{ const X = ox + (px - bx) * k, Y = oy + (py - by) * k; if(i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }); if(s.length === 1) ctx.lineTo(ox + (s[0][0] - bx) * k + 1, oy + (s[0][1] - by) * k); ctx.stroke(); });
  ctx.restore();
}
/* traguardi della tessera presenze */
function sigWeekKey(iso){ const d = new Date(iso + "T12:00:00Z"), day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day); return d.toISOString().slice(0,10); }
/* STATUS del cliente in base alle sedute fatte con te: uno ogni 25 fino a 200, poi ogni 50 fino a 500 (VIP Platino) */
const SIG_STATUS = [[25,"🥉","Bronzo","Bronze"],[50,"🥈","Argento","Silver"],[75,"🥇","Oro","Gold"],[100,"💚","Smeraldo","Emerald"],[125,"💙","Zaffiro","Sapphire"],
  [150,"❤️","Rubino","Ruby"],[175,"💜","Ametista","Amethyst"],[200,"💎","Diamante","Diamond"],[250,"💠","Diamante Blu","Blue Diamond"],[300,"⚙️","Titanio","Titanium"],
  [350,"🖤","Carbonio","Carbon"],[400,"⭐","Elite","Elite"],[450,"🏛️","Leggenda","Legend"],[500,"👑","VIP Platino","Platinum VIP"]];
function sigStatus(all, en){ const r = SIG_STATUS.filter(x=>(Number(all) || 0) >= x[0]).pop(); return r ? {n:r[0], e:r[1], name: en ? r[3] : r[2]} : null; }
function sigStatusNext(all, en){ const r = SIG_STATUS.find(x=>x[0] > (Number(all) || 0)); return r ? {n:r[0], e:r[1], name: en ? r[3] : r[2]} : null; }
/* traguardi della tessera (con emoji): pacchetto, settimane di fila, status */
function sigBadges(o){                                  // o: {total, used, dates:[date sedute FATTE], allTime, lang, single}
  const out = [], dates = (o.dates || []).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d || "")), used = Number(o.used) || dates.length, t = o.total || 0, L = o.lang === "en", all = Number(o.allTime) || 0;
  if(!o.single){
    if(t > 1 && used >= t) out.push(L ? "🏆 Package completed! 🎉" : "🏆 Pacchetto completato! 🎉");
    else if(t > 1 && used >= Math.ceil(t / 2)) out.push(L ? "🎉 You're halfway through the package! 🎯" : "🎉 Sei a metà pacchetto! 🎯");
    const run = sigWeekRun(dates);
    if(run >= 2) out.push(L ? `🏅 ${run} weeks in a row 🗓️🔥💪` : `🏅 ${run} settimane di fila 🗓️🔥💪`);
  }
  const st = sigStatus(all, L);
  if(st) out.push(L ? `${st.e} ${st.name} status: ${all} sessions together 🤝💯🌟` : `${st.e} Status ${st.name}: ${all} sedute insieme 🤝💯🌟`);
  else if(all >= 10) out.push(L ? `🏅 ${all} sessions together 🤝💯🌟` : `🏅 ${all} sedute insieme 🤝💯🌟`);
  return out;
}
/* settimane di fila (fino all'ultima data) */
function sigWeekRun(dates){
  const weeks = [...new Set((dates || []).filter(Boolean).map(sigWeekKey))].sort(); if(!weeks.length) return 0;
  let run = 1; for(let i = weeks.length - 1; i > 0; i--){ const a = new Date(weeks[i] + "T12:00:00Z"), b = new Date(weeks[i-1] + "T12:00:00Z"); if(Math.round((a - b) / 864e5) === 7) run++; else break; }
  return run;
}
/* tessera presenze (immagine): nome, pacchetto attivo, frase del giorno, firma della seduta, progressi,
   fatte / saltate / mancano / nel pacchetto, date ancora da firmare (solo pacchetto attivo) e traguardi.
   o = {name, trainer, start, total, done, lost, seq, today:{date, label, n, s, miss, signed}, unsigned:[{date, miss}], dates, allTime, msg:{e, t}, lang, now} */
function sigCardCanvas(o){
  const L = o.lang === "en", W = 1080, M = 64, CW = W - 2 * M;
  const total = Math.max(0, Number(o.total) || 0), done = Math.max(0, Number(o.done) || 0), lost = Math.max(0, Number(o.lost) || 0);
  const seq = Array.isArray(o.seq) && o.seq.length ? o.seq : [...Array(done).fill("done"), ...Array(lost).fill("miss")];
  const used = done + lost, left = Math.max(0, total - used), td = o.today || {}, unsigned = (o.unsigned || []).filter(u=>u && u.date), all = Number(o.allTime) || 0;
  const dIt = d => /^\d{4}-\d{2}-\d{2}$/.test(d || "") ? d.split("-").reverse().join("/") : "";
  const C = {pine:"#14213d", moss:"#2F6B4F", mossD:"#24573F", soft:"#eef6f0", line:"#d5ddd8", muted:"#5f6b66", owed:"#B45309", owedSoft:"#fdf3e6", gold:"#C9971C", goldSoft:"#fbf3dc"};
  const EM = `"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"`;
  const F = (w, s) => `${w} ${s}px "Barlow Condensed","Arial Narrow",Arial,${EM},sans-serif`, G = (w, s) => `${w} ${s}px Barlow,Arial,${EM},sans-serif`;
  const badges = sigBadges({total, used, dates: o.dates || [], allTime: all, lang: o.lang, single: !!o.single});
  const nx = sigStatusNext(all, L), nk = nx ? nx.n - all : 0, st = sigStatus(all, L);
  const nextTxt = nx ? (L ? `⚪ Next status: ${nx.e} ${nx.name} at ${nx.n} sessions (${nk} to go) 🔒🚀` : `⚪ Prossimo status: ${nx.e} ${nx.name} a ${nx.n} sedute (${nk === 1 ? "ne manca 1" : `ne mancano ${nk}`}) 🔒🚀`)
    : (L ? "👑 You've reached the highest status!" : "👑 Hai raggiunto lo status più alto!");
  const meas = document.createElement("canvas").getContext("2d");
  const wrap = (t, font, w) => { meas.font = font; const out = []; let line = ""; String(t).split(" ").forEach(wd=>{ const tt = line ? line + " " + wd : wd; if(meas.measureText(tt).width > w && line){ out.push(line); line = wd; } else line = tt; }); if(line) out.push(line); return out; };
  const stTxt = unsigned.length
    ? (L ? "All sessions are signed except: " : "Tutte le lezioni sono state firmate tranne: ") + unsigned.map(u=>dIt(u.date) + (u.miss ? (L ? " (missed)" : " (saltata)") : "")).join(", ")
    : (L ? "All previous sessions have been signed." : "Tutte le lezioni precedenti sono state firmate.");
  const stLines = wrap(stTxt, G("600", 30), CW - 120);
  const msgLines = o.msg && o.msg.t ? wrap(o.msg.t, G("700", 34), CW - 150) : [];
  const perRow = total > 12 ? Math.ceil(total / Math.ceil(total / 12)) : Math.max(total, 1), dotRows = Math.max(1, Math.ceil(Math.max(total, used) / perRow));
  const dotD = Math.min(64, (CW - (perRow - 1) * 14) / perRow);
  const msgH = msgLines.length ? Math.max(120, msgLines.length * 46 + 56) : 0;
  const stH = Math.max(110, stLines.length * 42 + 60), bl = badges.length + 1;
  const one = !!o.single;                                                   // seduta singola: niente progressi, conteggi e date da firmare
  const H = 300 + (msgH ? 50 + msgH : 0) + 70 + 24 + 300 + 60 + (one ? 0 : 30 + dotRows * (dotD + 16) + 40 + 150 + 50 + stH + 80) + 20 + bl * 66 + 140;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");

function privacyFlow(o){
  const t = PRIV_TX[o.en ? "en" : "it"];
  return new Promise(resolve=>{
    const w = document.createElement("div"); w.className = "pv-ovl"; w.id = "privacyModal";
    w.setAttribute("role", "dialog"); w.setAttribute("aria-modal", "true"); w.setAttribute("aria-label", t.sTitle);
    document.body.appendChild(w);
    const prevOverflow = document.body.style.overflow; document.body.style.overflow = "hidden";
    const step1 = () => {
      w.innerHTML = `<div class="pv-box"><div class="pv-scroll">${privSummaryHTML(o.en, o.pdfUrl)}</div><div class="pv-foot">
        <button type="button" class="pv-ok" id="privacyOk">✔ ${t.ok}</button></div></div>`;
      w.querySelector("#privacyOk").onclick = step2;
    };
    const step2 = () => {
      w.innerHTML = `<div class="pv-box pv-sign"><div class="pv-scroll"><div class="pv-ic">✍️</div><h2 class="pv-h">${t.signT}</h2>
        <p class="pv-sub">${privEsc(o.name || "")}${o.name ? " · " : ""}${privWhen(Date.now(), o.en)}</p>
        <div class="pv-pad"><canvas id="privCv" aria-label="${t.signHint}"></canvas><span class="pv-ph">${t.signHint}</span></div>
        <p class="pv-err" id="privacyErr" role="alert" hidden></p></div>
        <div class="pv-foot pv-row"><button type="button" class="pv-btn" id="privClr">${t.clear}</button><button type="button" class="pv-ok" id="privSign" disabled>✔ ${t.confirm}</button></div></div>`;
      const ok = w.querySelector("#privSign"), err = w.querySelector("#privacyErr"), ph = w.querySelector(".pv-ph");
      const pad = SigPad(w.querySelector("#privCv"), ()=>{ const n = pad.points(); ok.disabled = n < 3; ph.hidden = n > 0; err.hidden = true; });
      const fit = () => pad.fit(); requestAnimationFrame(fit); window.addEventListener("resize", fit);
      w.querySelector("#privClr").onclick = () => pad.clear();
      ok.onclick = async () => {
        const s = pad.encode(); if(s.length < 8) return;
        ok.disabled = true; let saved = false;
        try{ saved = await o.save(s); }catch(_){ saved = false; }
        if(!saved){ ok.disabled = false; err.hidden = false; err.textContent = t.err; return; }
        window.removeEventListener("resize", fit);
        step3(s, Date.now());
      };
    };
    const step3 = (s, at) => {
      w.innerHTML = `<div class="pv-box pv-done"><div class="pv-head"><h2 class="pv-h pv-okh">✔ ${t.doneT}</h2><p class="pv-sub">${t.doneSub}</p></div>
        <div class="pv-scroll pv-docwrap">${privDocHTML(o.en, {name: o.name, when: privWhen(at, o.en), s})}</div>
        <div class="pv-foot"><button type="button" class="pv-ok" id="privCont">${t.cont}</button></div></div>`;
      const wrap = w.querySelector(".pv-docwrap");
      requestAnimationFrame(()=>{ privDrawSig(wrap, s); wrap.scrollTop = wrap.scrollHeight; });
      w.querySelector("#privCont").onclick = () => { w.remove(); document.body.style.overflow = prevOverflow; resolve(true); };   // non resta salvato da nessuna parte
    };
    step1();
  });
}

      <div class="head"><h1>${esc(T("Ciao", "Hi"))} ${esc(info.first || "")}!</h1>
      <p class="what">${esc(info.miss ? T("Conferma la lezione saltata del", "Confirm the missed lesson on") : T("Conferma la seduta del", "Confirm the session on"))} ${esc(dIt(info.date))}</p>
      <p class="sub">${esc(info.label || "")}</p></div>
      <div class="turn"><span class="ic" aria-hidden="true">📱↻</span><span>${esc(T("Gira il telefono in orizzontale per firmare", "Turn your phone sideways to sign"))}</span></div>
      <div class="tools"><button type="button" class="zb" id="zout" aria-label="${esc(T("Rimpicciolisci il riquadro", "Make the box smaller"))}">➖</button><span class="zl" id="zl">100%</span><button type="button" class="zb" id="zin" aria-label="${esc(T("Ingrandisci il riquadro", "Make the box bigger"))}">➕</button>
        <button type="button" class="fsb" id="fs">⤢ ${esc(T("Schermo intero", "Full screen"))}</button><span class="sp lnd"></span>
        <button type="button" class="lnd" id="clr3">${esc(T("Cancella", "Clear"))}</button><button type="button" class="primary lnd" id="ok3" disabled>✔ ${esc(T("Invia firma", "Send signature"))}</button></div>
      <div class="pad" id="pad"><div class="padtop">${esc(T("Gira il telefono in orizzontale e firma con il dito.", "Turn your phone sideways and sign with your finger."))}</div>
        <canvas id="cv" aria-label="${esc(T("Riquadro per firmare", "Signature box"))}"></canvas><div class="ph" id="ph"><span>${esc(T("↑ Firma con il dito sopra la linea", "↑ Sign with your finger above the line"))}<small>${esc(T("qui sotto puoi scorrere e ingrandire", "down here you can scroll and zoom"))}</small></span></div>
        <div class="padbar"><button type="button" id="clr2">${esc(T("Cancella", "Clear"))}</button><button type="button" class="primary" id="done2">✔ ${esc(T("Fatto", "Done"))}</button></div></div>
      <div class="row bottom"><button type="button" id="clr">${esc(T("Cancella", "Clear"))}</button><button type="button" class="primary" id="ok" disabled>✔ ${esc(T("Invia firma", "Send signature"))}</button></div>
      <p class="err" id="err" role="alert"></p>`;
    /* grandezza del riquadro: ➕ ➖ oppure due dita (la firma si ridisegna in proporzione, senza sgranare) */
    let z = 1, z0 = 1;
    const baseH = () => matchMedia("(orientation: landscape)").matches ? Math.max(200, innerHeight - 112) : Math.max(300, Math.min(innerHeight * 0.6, 560));
    const size = () => { if($("pad").classList.contains("full")){ $("pad").style.height = ""; } else $("pad").style.height = Math.round(baseH() * z) + "px"; $("zl").textContent = Math.round(z * 100) + "%"; pad.fit(); };
    const zoom = v => { z = Math.max(0.6, Math.min(2, Math.round(v * 100) / 100)); size(); };
    const pad = SigPad($("cv"), ()=>{ $("ok").disabled = $("ok3").disabled = pad.points() < 3;  $("err").textContent = ""; },
      {pinch: (k, ph) => { if(ph === "start") z0 = z; else if(ph === "move") zoom(z0 * k); }});
    $("zin").onclick = () => zoom(z + 0.2); $("zout").onclick = () => zoom(z - 0.2);
    size(); window.addEventListener("resize", size); window.addEventListener("orientationchange", ()=>setTimeout(size, 250));
    $("clr").onclick = $("clr2").onclick = $("clr3").onclick = () => pad.clear();
    $("ok3").onclick = () => $("ok").click();
    const full = on => { $("pad").classList.toggle("full", on); document.body.style.overflow = on ? "hidden" : ""; requestAnimationFrame(size); };
    $("fs").onclick = () => full(true); $("done2").onclick = () => full(false);
    $("ok").onclick = async () => {
      const s = pad.encode(); if(s.length < 8) return;
      $("ok").disabled = $("ok3").disabled = true; $("err").textContent = "";
      let rr;
      try{ rr = await fetch("api/firme", {method:"POST", cache:"no-store", headers:{"Content-Type":"application/json"}, body: JSON.stringify({t, s})}); }
      catch(_){ $("ok").disabled = $("ok3").disabled = false; $("err").textContent = T("Non riesco a inviare: controlla la connessione e riprova.", "I can't send it: check your connection and try again."); return; }
      if(rr.status === 410) return fail("expired");
      if(!rr.ok){ $("ok").disabled = $("ok3").disabled = false; $("err").textContent = T("Qualcosa non va: riprova.", "Something went wrong: try again."); return; }
      done(info, s);
    };
  }
  async function done(info, s){
    try{ if(document.fonts && document.fonts.load) await Promise.race([Promise.all([document.fonts.load('700 40px "Barlow Condensed"'), document.fonts.load("600 30px Barlow"), document.fonts.load("500 30px Barlow")]), new Promise(r=>setTimeout(r, 1500))]); }catch(_){}
    let html = `<div class="top"></div><div class="done"><h1>✅ ${esc(T("Grazie!", "Thank you!"))}</h1><p class="sub">${esc(T("Firma ricevuta.", "Signature received."))}</p>`;
    const c = info.card;
    if(c && (c.total > 0 || c.single)){
      const cv = sigCardCanvas(Object.assign({}, c, {today: Object.assign({}, c.today || {}, {s}), lang: info.lang}));
      html += `<p>${esc(T("Ecco la tua tessera presenze con i traguardi:", "Here is your attendance card with your milestones:"))}</p><img id="cardImg" alt="${esc(T("Tessera presenze", "Attendance card"))}" src="${cv.toDataURL("image/png")}">
        <div class="row" id="cardActs"><button type="button" id="skip">⏭ ${esc(T("Salta", "Skip"))}</button><button type="button" class="primary" id="save">⬇ ${esc(T("Salva immagine", "Save image"))}</button></div>
        <p class="muted">${esc(T("Puoi chiudere questa pagina.", "You can close this page."))}</p>`;
      box.innerHTML = html + "</div>";
      /* v105: “Salta” toglie la tessera e lascia solo “Grazie! Firma ricevuta” */
      $("skip").onclick = () => { ["cardImg", "cardActs"].forEach(id=>{ const e = $(id); if(e) e.remove(); }); const pp = box.querySelector(".done > p:not(.sub):not(.muted)"); if(pp) pp.remove(); };
      $("save").onclick = async () => {
        const name = T("Tessera presenze", "Attendance card") + ".png";
        const blob = await new Promise(r=>cv.toBlob(r, "image/png"));
        try{ const f = new File([blob], name, {type:"image/png"}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){ if(e && e.name === "AbortError") return; }
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      };
    } else box.innerHTML = html + `<p class="muted">${esc(T("Puoi chiudere questa pagina.", "You can close this page."))}</p></div>`;
  }
  start();
})();
</script>
</body>
</html>
